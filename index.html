<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>용용이 사진첩</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.png" type="image/png" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
:root{--bg:#f5f5f7;--bd:#e5e5ea;--pri:#007aff;--tx:#1c1c1e;--mu:#8e8e93;--red:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font:15px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px;flex:none}
button,.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:600;font-size:13px;font-family:inherit;background:var(--bg);color:var(--tx);cursor:pointer}
.pri{background:var(--pri);color:#fff}.red{background:var(--red);color:#fff}
.ib{background:none;font-size:21px;padding:2px 6px}
.wrap{flex:1;display:flex;min-height:0}
.side{width:66px;flex:none;background:#fff;border-right:1px solid var(--bd);overflow-y:auto}
.side div{text-align:center;padding:9px 4px;font-size:12px;line-height:1.25;font-weight:600;border-bottom:1px solid var(--bd);word-break:break-all}
.side div.on{background:var(--pri);color:#fff}.side small{opacity:.7;font-weight:400;font-size:10px}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--bd);padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.dh{padding:6px 8px 2px;font-size:12px;font-weight:700;color:var(--mu)}
.hint{padding:6px 8px;font-size:12px;color:var(--pri)}
.pg{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:1px}
.pg div{position:relative;aspect-ratio:1;background:#d8dde2;user-select:none}
.pg img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pg b{position:absolute;right:4px;bottom:2px;color:#fff}
.ov{display:none;position:fixed;inset:0;z-index:600;background:var(--bg);flex-direction:column;padding:12px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.ov.show{display:flex}
#gv{background:#0b1015;color:#fff;padding:0}
#gv .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#gv .m{position:absolute;inset:0}#gv .m img,#gv .m video{width:100%;height:100%;object-fit:contain;display:block}
#gv .r{display:flex;gap:8px;padding:10px;align-items:center}
#gtools{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);gap:8px;z-index:3}
#gdel,#gedit,#gpb,#grot{padding:12px 16px;font-size:15px;border-radius:24px;color:#fff;white-space:nowrap}
#gdel{background:var(--red)}#gedit,#gpb,#grot{background:#3a4450}
#map{height:55vh;border-radius:10px;margin:8px 0}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}
input,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px}
.card{background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.pg .mv{position:absolute;left:4px;top:4px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;z-index:1}
.gst{display:block;padding:3px 8px;min-height:20px;font-size:12px;color:var(--pri)}
#gdate{position:absolute;top:14px;left:16px;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;z-index:2;pointer-events:none}
#spd{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:6px 14px;border-radius:16px;font-size:14px;display:none;z-index:2;pointer-events:none}
#gv,#gv .m{touch-action:none;user-select:none;-webkit-user-select:none}
#gcap{position:absolute;left:16px;right:16px;text-align:center;color:#fff;font-size:18px;line-height:1.4;text-shadow:0 1px 4px #000,0 0 8px #000;z-index:2;pointer-events:none;white-space:pre-wrap;word-break:break-word}
#gced{display:none;position:absolute;left:0;right:0;top:0;background:rgba(20,24,30,.96);padding:12px;z-index:5}
#gced textarea{width:100%;height:90px;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:0;background:#fff;color:#111}
.sel{outline:4px solid var(--pri);outline-offset:-4px;opacity:.6}
@keyframes popIn{from{transform:scale(2.6);box-shadow:0 8px 28px rgba(0,0,0,.55)}to{transform:scale(1);box-shadow:0 0 0 rgba(0,0,0,0)}}
.popin{animation:popIn .4s ease-out;z-index:6}
.zw{position:absolute;inset:0}.ph img{width:100%;height:100%;display:block}.ink{pointer-events:none}
#gpen{display:none;position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,30,.93);padding:10px;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:4}
#gpen button{color:#fff;background:#3a4450}#gpen .pri{background:var(--pri)}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.dot.on{border-color:#fff}
#mpanel{display:none;background:#f1f6ff;border-bottom:1px solid var(--bd);max-height:38vh;overflow-y:auto;padding:6px 10px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mi{padding:7px 0;border-top:1px solid #dde6f5}.md{font-size:12px;color:var(--mu)}.mt{font-size:14px;white-space:pre-wrap;word-break:break-word}
.ml{font-size:12px;color:var(--mu);margin:10px 0 3px}
</style>
</head>
<body>
<div class="top"><span>용용이 사진첩 <small id="srv" style="font-size:12px;font-weight:400"></small></span><span><button class="ib" id="kb" onclick="setPw()" style="display:none">🔑</button><button class="ib" onclick="openMap()">🗺</button><button class="ib" onclick="openSteps()">👣</button></span></div>

<div class="wrap">
<div class="side" id="gside"></div>
<div class="main">
<div class="bar"><span id="gtt" onclick="renGrp()"></span><small id="usg" onclick="showUsg()" style="color:var(--mu);white-space:nowrap;cursor:pointer"></small><button id="gmode" onclick="togM()"></button><button onclick="cycCols()">▦</button><button onclick="grpMenu()">⋯</button><label class="btn pri">＋<input type="file" accept="image/*,video/*" multiple hidden onchange="upP([...this.files]);this.value=''" /></label></div>
<small id="gst" class="gst"></small>
<div id="mpanel"></div>
<div id="gbody"></div>
</div>
</div>

<div class="ov" id="mapv">
<div class="row"><button onclick="closeOv('mapv')">닫기</button><label class="btn pri">GPX 올리기<input type="file" accept=".gpx" hidden onchange="addGpx(this.files[0]);this.value=''" /></label></div>
<div id="map"></div><div id="trk"></div>
</div>
<div class="ov" id="stv">
<div class="row"><button onclick="closeOv('stv')">닫기</button></div>
<div class="row"><input id="sd" type="date" /><input id="sn" type="number" placeholder="걸음 수" /><button class="pri" onclick="saveStep()">저장</button></div>
<div id="sl"></div>
</div>
<div class="ov" id="gv">
<div class="m" id="gm"></div>
<div id="gdate"></div><div id="spd">2배속 ▶▶</div>
<div id="gcap"></div>
<div id="gtools" style="display:none"><button id="gedit" onclick="editCap()">✎ 글</button><button id="gpb" onclick="penOn()">✍ 펜</button><button id="grot" onclick="rotP()">↻</button><button id="gdel" onclick="delG()">삭제</button></div>
<div id="gpen"><span id="gpc" style="display:flex;gap:6px"></span><button id="gpw" onclick="penW()"></button><button id="gpe" onclick="penE()"></button><button onclick="penUndo()">↶</button><button class="pri" onclick="penDone()">완료</button></div>
<div id="gced"><textarea id="gcti" maxlength="200" oninput="$('#gcap').textContent=this.value" placeholder="사진에 넣을 글을 적어 주세요"></textarea><div class="row"><button id="gcpb" onclick="capPos()"></button><span style="flex:1"></span><button onclick="capCancel()">취소</button><button class="pri" onclick="capSave()">저장</button></div></div>
</div>

<div class="ov" id="medit">
<div class="row"><b id="metitle">기록</b></div>
<div class="ml">날짜</div><input id="mdt" type="date" />
<div class="ml">주행거리 (km)</div><input id="mkm" type="number" inputmode="numeric" />
<div class="ml">금액 (원)</div><input id="mct" type="number" inputmode="numeric" />
<div class="ml">내용</div><textarea id="mtx" style="height:140px" placeholder="예: 엔진오일 교환, 주유 40L 등"></textarea>
<div class="row"><button class="red" id="mdel" onclick="memoDel()">삭제</button><span style="flex:1"></span><button onclick="closeOv('medit')">취소</button><button class="pri" onclick="memoSave()">저장</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
const API='https://lively-art-8873.86400seccc.workers.dev';
let PW=localStorage.getItem('yy_pw')||'',data={groups:[],steps:{},tracks:[],ts:0};
let galG=null,galList=[],selP=null,gi=[],gx=0,sx0=0,gTok=0,pushT,map,mk=[],pl=[];
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=k=>API+'/f/'+k+'?t='+encodeURIComponent(PW);

/* ===== 서버 통신 ===== */
function ask(){const p=prompt('비밀번호를 입력하세요');if(p){PW=p;localStorage.setItem('yy_pw',p)}return !!p}
async function req(path,opt={}){opt.headers=Object.assign({},opt.headers||{},{'x-pw':PW});
const r=await fetch(API+path,opt);
if(r.status===401){alert('비밀번호가 맞지 않습니다.');PW='';localStorage.removeItem('yy_pw');if(ask())return req(path,opt)}
return r}
async function put(k,b,t){const r=await req('/f/'+k,{method:'PUT',headers:{'content-type':t},body:b});if(!r.ok)throw new Error('업로드 실패 '+r.status)}
async function del(keys){if(!keys.length)return;const r=await req('/api/del',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(keys)});if(!r.ok)throw new Error('응답 '+r.status)}
async function delSrv(keys){try{await del(keys);usage()}catch(e){alert('서버에 연결할 수 없어 목록에서만 지웠습니다. 서버의 파일은 남아 있을 수 있습니다. ('+e.message+')')}}
function save(){data.ts=Date.now();localStorage.setItem('yy_data',JSON.stringify(data));clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){try{await req('/api/data',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)})}catch(e){}}
function srv(t){$('#srv').textContent=t}
function setPw(){const p=prompt('비밀번호를 입력하세요 (Cloudflare Worker의 PASSWORD 값)');if(p){PW=p;localStorage.setItem('yy_pw',p);init()}}
async function init(){
try{const c=JSON.parse(localStorage.getItem('yy_data')||'null');if(c)data=c}catch(e){}
render();
if(API.includes('여기에')){srv('⚠ API 주소 미설정');alert('index.html 맨 위의 API 주소를 Cloudflare Worker 주소로 바꿔야 합니다.');return}
if(!PW)ask();
try{const r=await fetch(API+'/api/data',{headers:{'x-pw':PW}});
if(r.status===401){srv('🔑 비밀번호 확인');$('#kb').style.display='';return}
if(!r.ok){srv('⚠ 서버 오류 '+r.status);return}
srv('☁ 연결됨');$('#kb').style.display='none';usage();const d=await r.json();
if(d.groups&&(d.ts||0)>(data.ts||0)){data=d;localStorage.setItem('yy_data',JSON.stringify(data));render()}
else if((data.ts||0)>(d.ts||0))push()}catch(e){srv('⚠ 서버 연결 안 됨 (주소 확인)')}}

/* ===== 대그룹 / 사진 목록 ===== */
let selG=null,lpFired=0,lpTimer=null,lpX=0,lpY=0;
function render(){
if(!data.groups.find(g=>g.id===galG))galG=data.groups[0]?data.groups[0].id:null;
const cg0=data.groups.find(x=>x.id===galG);$('#gside').innerHTML=data.groups.map(g=>`<div data-gid="${g.id}" class="${g.id===galG?'on':''}${g.id===selG?' sel':''}" onclick="tapG('${g.id}')">${esc(g.name)}<br><small>${(g.photos||[]).length}장</small></div>`).join('')+'<div onclick="addGrp()" style="color:var(--pri)">＋ 그룹</div><div onclick="togMemo()" style="color:var(--pri)">📝 메모'+(cg0&&cg0.memos&&cg0.memos.length?' ('+cg0.memos.length+')':'')+'</div>';
$('#gst').textContent=selG?'옮길 자리의 그룹을 누르세요 (같은 그룹을 다시 누르면 취소)':'';
renderBody();renderMemo()}
function tapG(id){if(Date.now()-lpFired<800)return;
if(selG){if(selG!==id){const a=data.groups.findIndex(x=>x.id===selG),b=data.groups.findIndex(x=>x.id===id);if(a>=0&&b>=0){const it=data.groups.splice(a,1)[0];data.groups.splice(b,0,it);save()}}selG=null;render();return}
if(selP){const from=data.groups.find(x=>x.id===galG),to=data.groups.find(x=>x.id===id);let msg='';
if(from&&to&&from!==to){const i=from.photos.findIndex(x=>x.id===selP);if(i>=0){to.photos=to.photos||[];to.photos.push(from.photos.splice(i,1)[0]);save();msg='「'+to.name+'」로 옮겼습니다'}}
selP=null;render();if(msg)$('#gst').textContent=msg;return}
galG=id;render()}
function addGrp(){const n=prompt('그룹 이름');if(!n||!n.trim())return;const g={id:uid(),name:n.trim(),photos:[]};data.groups.push(g);galG=g.id;save();render()}
function renGrp(){const g=data.groups.find(x=>x.id===galG);if(!g)return;const n=prompt('새 이름',g.name);if(n&&n.trim()){g.name=n.trim();save();render()}}
async function delGrp(){const g=data.groups.find(x=>x.id===galG);if(!g)return;
if(!confirm('「'+g.name+'」와 안의 사진 '+(g.photos||[]).length+'장이 모두 삭제됩니다. 계속할까요?'))return;
const keys=(g.photos||[]).flatMap(i=>[i.p,i.t]);data.groups=data.groups.filter(x=>x.id!==g.id);save();render();delSrv(keys)}
function togM(){const g=data.groups.find(x=>x.id===galG);if(!g)return;g.manual=!g.manual;selP=null;save();renderBody()}
let errShown=false;
function imgErr(im){if(errShown)return;errShown=true;
fetch(im.src).then(r=>{$('#gst').textContent='사진 불러오기 실패 - 서버 응답 '+r.status+(r.status===401?' (비밀번호 불일치)':r.status===404?' (파일 없음)':r.status===200?' (파일은 있으나 이미지 형식 오류)':'')}).catch(e=>{$('#gst').textContent='사진 불러오기 실패 - 서버에 연결할 수 없음 ('+e.message+')'})}
function renderBody(){
errShown=false;
const g=data.groups.find(x=>x.id===galG);
if(!g){$('#gtt').textContent='';$('#gmode').textContent='';$('#gbody').innerHTML='<div class="hint">왼쪽 아래 ＋ 그룹을 눌러 시작하세요</div>';return}
g.photos=g.photos||[];$('#gtt').textContent=g.name;$('#gmode').textContent=g.manual?'🖐 직접':'📅 날짜';
const cell=i=>`<div data-pid="${i.id}" onclick="tapP('${i.id}')"${i.id===selP?' class="sel"':''}><img src="${F(i.t)}"${i.rot?' style="transform:rotate('+i.rot+'deg)"':''} loading="lazy" decoding="async" onerror="imgErr(this)">${i.k==='v'?'<b>▶</b>':''}</div>`;
const hint=selP?(g.manual?'선택됨 · 옮길 자리의 사진을 누르거나, 왼쪽에서 다른 그룹을 누르세요 (같은 사진을 다시 누르면 취소)':'선택됨 · 왼쪽에서 옮길 그룹을 누르세요 (사진을 누르면 취소)'):(g.manual?'사진을 1초 이상 누르면 옮길 수 있습니다':'');
$('#gst').textContent=selG?'옮길 자리의 그룹을 누르세요 (같은 그룹을 다시 누르면 취소)':hint;applyCols();const hh='';
if(g.manual){galList=[...g.photos];$('#gbody').innerHTML=hh+'<div class="pg">'+galList.map(cell).join('')+'</div>';return}
galList=[...g.photos].sort((a,b)=>(b.at||0)-(a.at||0));const days={};
galList.forEach(i=>{const d=new Date(i.at||0),k=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');(days[k]=days[k]||[]).push(i)});
$('#gbody').innerHTML=hh+(Object.keys(days).map(k=>`<div class="dh">${k}</div><div class="pg">${days[k].map(cell).join('')}</div>`).join('')||'<div class="hint">사진이 없습니다. 오른쪽 위 ＋를 눌러 올리세요.</div>')}
function tapP(id){if(Date.now()-lpFired<800)return;
if(selP){const g=data.groups.find(x=>x.id===galG);
if(selP!==id&&g&&g.manual){const a=g.photos.findIndex(x=>x.id===selP),b=g.photos.findIndex(x=>x.id===id);if(a>=0&&b>=0){const it=g.photos.splice(a,1)[0];g.photos.splice(b,0,it);save()}}
selP=null;render();return}
viewP(id)}

/* ===== 올리기 (사진 압축 / 영상 압축) ===== */
async function rs(src,w,q){const b=src instanceof Blob?await createImageBitmap(src,{imageOrientation:'from-image'}):src;
const s=Math.min(1,w/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s|0;c.height=b.height*s|0;
c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
const once=(e,ev)=>new Promise((r,j)=>{e.addEventListener(ev,r,{once:true});e.addEventListener('error',()=>j(new Error('읽기 실패')),{once:true})});
async function vthumb(f){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);await once(v,'loadeddata');
v.currentTime=Math.min(.5,v.duration||0);await once(v,'seeked');return rs(await createImageBitmap(v),400,.7)}
async function packV(f){try{const v=document.createElement('video');v.playsInline=true;v.volume=0;v.src=URL.createObjectURL(f);await once(v,'loadedmetadata');
const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*s&~1;c.height=v.videoHeight*s&~1;
const x=c.getContext('2d'),out=c.captureStream(30);await v.play();(v.captureStream?v.captureStream():new MediaStream()).getAudioTracks().forEach(t=>out.addTrack(t));
const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
const rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:3e6}),ch=[];rec.ondataavailable=e=>ch.push(e.data);
const done=new Promise(r=>rec.onstop=r);rec.start(1000);
(function d(){if(v.ended)return;x.drawImage(v,0,0,c.width,c.height);requestAnimationFrame(d)})();
await once(v,'ended');rec.stop();await done;const o=new Blob(ch,{type:mt.split(';')[0]});return o.size&&o.size<f.size?o:f}catch(e){return f}}
async function one(f,gid){const v=f.type.startsWith('video'),id=uid(),d='g/'+gid+'/';let m,t,lat,lng,ext='jpg',at=f.lastModified,ar;
if(v){m=await packV(f);t=await vthumb(f);ext=m===f?(f.name.split('.').pop()||'mp4'):m.type.includes('mp4')?'mp4':'webm'}
else{const g=await exifr.gps(f).catch(()=>null);if(g){lat=g.latitude;lng=g.longitude}

function renderMemo(){const p=$('#mpanel'),g=cg();if(!memoOpen||!g){p.style.display='none';return}
const ms=(g.memos||[]).slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')||(b.id>a.id?1:-1));p.style.display='block';
p.innerHTML='<div class="mh"><b>📝 '+esc(g.name)+' 메모</b><button class="pri" onclick="memoEdit()">＋ 기록</button></div>'+(ms.length?ms.map(m=>'<div class="mi" onclick="memoEdit(\''+m.id+'\')"><div class="md">'+esc((m.d||'').replace(/-/g,'.'))+(m.km?' · '+Number(m.km).toLocaleString()+'km':'')+(m.c?' · '+Number(m.c).toLocaleString()+'원':'')+'</div><div class="mt">'+esc(m.t)+'</div></div>').join(''):'<div class="hint">기록이 없습니다. ＋ 기록을 눌러 추가하세요.</div>')}
function memoEdit(id){const g=cg();if(!g)return;const m=id&&(g.memos||[]).find(x=>x.id===id);editMid=m?m.id:null;
$('#mdt').value=m?m.d:new Date().toLocaleDateString('sv-SE');$('#mkm').value=(m&&m.km)||'';$('#mct').value=(m&&m.c)||'';$('#mtx').value=m?m.t:'';
$('#mdel').style.display=m?'':'none';$('#metitle').textContent=m?'기록 수정':'새 기록';openOv('medit')}
function memoSave(){const g=cg();if(!g)return;const t=$('#mtx').value.trim(),km=$('#mkm').value,c=$('#mct').value;
if(!t&&!km&&!c)return alert('내용을 입력해 주세요.');g.memos=g.memos||[];
const o={d:$('#mdt').value,km:km?+km:null,c:c?+c:null,t};
if(editMid){Object.assign(g.memos.find(x=>x.id===editMid),o)}else{g.memos.push(Object.assign({id:uid()},o))}
save();closeOv('medit');memoOpen=true;render()}
function memoDel(){const g=cg();if(!g||!editMid)return;if(!confirm('이 기록을 삭제할까요?'))return;g.memos=g.memos.filter(x=>x.id!==editMid);save();closeOv('medit');render()}
function grpMenu(){const g=cg();if(!g)return;const fs=localStorage.getItem('yy_fs')!=='0';
const c=prompt('「'+g.name+'」\n1 = 이름 바꾸기\n2 = 그룹 삭제 (사진·메모가 없을 때만)\n3 = 크게 볼 때 전체 화면 '+(fs?'끄기':'켜기'),'1');
if(c==='1')renGrp();
else if(c==='3'){localStorage.setItem('yy_fs',fs?'0':'1');alert('크게 볼 때 전체 화면: '+(fs?'꺼짐 (주소창이 보입니다)':'켜짐'))}
else if(c==='2'){if((g.photos||[]).length||(g.memos||[]).length)return alert('사진이나 메모가 들어 있는 그룹은 삭제할 수 없습니다.\n먼저 지우거나 다른 그룹으로 옮겨 주세요.');
if(confirm('빈 그룹 「'+g.name+'」을(를) 삭제할까요?')){data.groups=data.groups.filter(x=>x.id!==g.id);save();render()}}}

function lpBind(root,sel,fn){
root.addEventListener('touchstart',e=>{const t=e.target.closest(sel);if(!t||e.touches.length>1)return;lpX=e.touches[0].clientX;lpY=e.touches[0].clientY;clearTimeout(lpTimer);
lpTimer=setTimeout(()=>{lpFired=Date.now();if(navigator.vibrate)navigator.vibrate(40);fn(t)},1000)},{passive:true});
root.addEventListener('touchmove',e=>{const q=e.touches[0];if(Math.hypot(q.clientX-lpX,q.clientY-lpY)>12)clearTimeout(lpTimer)},{passive:true});
['touchend','touchcancel'].forEach(ev=>root.addEventListener(ev,()=>clearTimeout(lpTimer)));
root.addEventListener('contextmenu',e=>e.preventDefault())}
lpBind($('#gbody'),'[data-pid]',el=>{selP=el.dataset.pid;selG=null;document.querySelectorAll('#gbody .sel,#gside .sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#gst').textContent=hintTxt()});
lpBind($('#gside'),'[data-gid]',el=>{selG=el.dataset.gid;selP=null;document.querySelectorAll('#gbody .sel,#gside .sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#gst').textContent=hintTxt()});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
