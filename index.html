<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>용용이 사진첩</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.png" type="image/png" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
:root{--bg:#f5f5f7;--bd:#e5e5ea;--pri:#007aff;--tx:#1c1c1e;--mu:#8e8e93;--red:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px;flex:none}
button,.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:600;font-size:13px;font-family:inherit;background:var(--bg);color:var(--tx);cursor:pointer}
.pri{background:var(--pri);color:#fff}.red{background:var(--red);color:#fff}
.ib{background:none;font-size:21px;padding:2px 6px}
.wrap{flex:1;display:flex;min-height:0}
.side{width:92px;flex:none;background:#fff;border-right:1px solid var(--bd);overflow-y:auto}
.side div{padding:14px 8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--bd);word-break:break-all}
.side div.on{background:var(--pri);color:#fff}.side small{opacity:.7;font-weight:400}
.main{flex:1;min-width:0;overflow-y:auto}
.bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--bd);padding:8px;display:flex;gap:6px;align-items:center}
.bar span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.dh{padding:10px 8px 4px;font-size:12px;font-weight:700;color:var(--mu)}
.hint{padding:6px 8px;font-size:12px;color:var(--pri)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
@media(min-width:700px){.pg{grid-template-columns:repeat(6,1fr)}}
.pg div{position:relative;aspect-ratio:1;background:#d8dde2;user-select:none}
.pg img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pg b{position:absolute;right:4px;bottom:2px;color:#fff}
.ov{display:none;position:fixed;inset:0;z-index:600;background:var(--bg);flex-direction:column;padding:12px;overflow-y:auto}
.ov.show{display:flex}
#gv{background:#0b1015;color:#fff;padding:0}
#gv .m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#gv .m img,#gv .m video{max-width:100%;max-height:100%}
#gv .r{display:flex;gap:8px;padding:10px;align-items:center}
#gv button{background:#2a323b;color:#fff;flex:none}
#map{height:55vh;border-radius:10px;margin:8px 0}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}
input{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px}
.card{background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="top"><span>용용이 사진첩</span><span><button class="ib" onclick="openMap()">🗺</button><button class="ib" onclick="openSteps()">👣</button></span></div>

<div class="wrap">
<div class="side" id="gside"></div>
<div class="main">
<div class="bar"><span id="gtt"></span><button id="gmode" onclick="togM()"></button><button onclick="renGrp()">✎</button><button onclick="delGrp()">🗑</button><label class="btn pri">＋<input type="file" accept="image/*,video/*" multiple hidden onchange="upP([...this.files]);this.value=''" /></label></div>
<small id="gst" style="display:block;padding:4px 8px;color:var(--mu)"></small>
<div id="gbody"></div>
</div>
</div>

<div class="ov" id="mapv">
<div class="row"><button onclick="closeOv('mapv')">닫기</button><label class="btn pri">GPX 올리기<input type="file" accept=".gpx" hidden onchange="addGpx(this.files[0]);this.value=''" /></label></div>
<div id="map"></div><div id="trk"></div>
</div>
<div class="ov" id="stv">
<div class="row"><button onclick="closeOv('stv')">닫기</button></div>
<div class="row"><input id="sd" type="date" /><input id="sn" type="number" placeholder="걸음 수" /><button class="pri" onclick="saveStep()">저장</button></div>
<div id="sl"></div>
</div>
<div class="ov" id="gv">
<div class="r"><button onclick="closeG()">닫기</button><span id="gc"></span><span style="flex:1"></span><button style="background:var(--red)" onclick="delG()">삭제</button></div>
<div class="m" id="gm"></div>
<div class="r"><button style="flex:1" onclick="mvG(-1)">‹</button><button style="flex:1" onclick="mvG(1)">›</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
const API='https://여기에_Worker_주소';
let PW=localStorage.getItem('yy_pw')||'',data={groups:[],steps:{},tracks:[],ts:0};
let galG=null,galList=[],selP=null,gi=[],gx=0,sx0=0,gTok=0,pushT,map,mk=[],pl=[];
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=k=>API+'/f/'+k+'?t='+encodeURIComponent(PW);

/* ===== 서버 통신 ===== */
function ask(){const p=prompt('비밀번호를 입력하세요');if(p){PW=p;localStorage.setItem('yy_pw',p)}return !!p}
async function req(path,opt={}){opt.headers=Object.assign({},opt.headers||{},{'x-pw':PW});
const r=await fetch(API+path,opt);
if(r.status===401){alert('비밀번호가 맞지 않습니다.');PW='';localStorage.removeItem('yy_pw');if(ask())return req(path,opt)}
return r}
async function put(k,b,t){const r=await req('/f/'+k,{method:'PUT',headers:{'content-type':t},body:b});if(!r.ok)throw new Error('업로드 실패 '+r.status)}
async function del(keys){if(keys.length)await req('/api/del',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(keys)})}
function save(){data.ts=Date.now();localStorage.setItem('yy_data',JSON.stringify(data));clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){try{await req('/api/data',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)})}catch(e){}}
async function init(){
try{const c=JSON.parse(localStorage.getItem('yy_data')||'null');if(c)data=c}catch(e){}
if(!PW)ask();
render();
try{const r=await req('/api/data');if(r.ok){const d=await r.json();
if(d.groups&&(d.ts||0)>(data.ts||0)){data=d;localStorage.setItem('yy_data',JSON.stringify(data));render()}
else if((data.ts||0)>(d.ts||0))push()}}catch(e){}}

/* ===== 대그룹 / 사진 목록 ===== */
function render(){
if(!data.groups.find(g=>g.id===galG))galG=data.groups[0]?data.groups[0].id:null;
$('#gside').innerHTML=data.groups.map(g=>`<div class="${g.id===galG?'on':''}" onclick="pickG('${g.id}')">${esc(g.name)}<br><small>${(g.photos||[]).length}장</small></div>`).join('')+'<div onclick="addGrp()" style="color:var(--pri)">＋ 그룹</div>';
renderBody()}
function pickG(id){galG=id;selP=null;render()}
function addGrp(){const n=prompt('그룹 이름');if(!n||!n.trim())return;const g={id:uid(),name:n.trim(),photos:[]};data.groups.push(g);galG=g.id;save();render()}
function renGrp(){const g=data.groups.find(x=>x.id===galG);if(!g)return;const n=prompt('새 이름',g.name);if(n&&n.trim()){g.name=n.trim();save();render()}}
async function delGrp(){const g=data.groups.find(x=>x.id===galG);if(!g)return;
if(!confirm('「'+g.name+'」와 안의 사진 '+(g.photos||[]).length+'장이 모두 삭제됩니다. 계속할까요?'))return;
await del((g.photos||[]).flatMap(i=>[i.p,i.t]));data.groups=data.groups.filter(x=>x.id!==g.id);save();render()}
function togM(){const g=data.groups.find(x=>x.id===galG);if(!g)return;g.manual=!g.manual;selP=null;save();renderBody()}
let errShown=false;
function imgErr(im){if(errShown)return;errShown=true;
fetch(im.src).then(r=>{$('#gst').textContent='사진 불러오기 실패 - 서버 응답 '+r.status+(r.status===401?' (비밀번호 불일치)':r.status===404?' (파일 없음)':r.status===200?' (파일은 있으나 이미지 형식 오류)':'')}).catch(e=>{$('#gst').textContent='사진 불러오기 실패 - 서버에 연결할 수 없음 ('+e.message+')'})}
function renderBody(){
errShown=false;
const g=data.groups.find(x=>x.id===galG);
if(!g){$('#gtt').textContent='';$('#gmode').textContent='';$('#gbody').innerHTML='<div class="hint">왼쪽 아래 ＋ 그룹을 눌러 시작하세요</div>';return}
g.photos=g.photos||[];$('#gtt').textContent=g.name;$('#gmode').textContent=g.manual?'🖐 직접':'📅 날짜';
const cell=(i,fn,st)=>`<div onclick="${fn}('${i.id}')"${st||''}><img src="${F(i.t)}" loading="lazy" onerror="imgErr(this)">${i.k==='v'?'<b>▶</b>':''}</div>`;
if(g.manual){galList=[...g.photos];
$('#gbody').innerHTML=`<div class="hint">${selP?'옮길 자리의 사진을 누르세요 (같은 사진을 다시 누르면 취소)':'옮길 사진을 먼저 누르세요 · 크게 보기는 📅 날짜 모드'}</div><div class="pg">`+galList.map(i=>cell(i,'pickP',i.id===selP?' style="outline:4px solid var(--pri);outline-offset:-4px;opacity:.6"':'')).join('')+'</div>';return}
galList=[...g.photos].sort((a,b)=>(b.at||0)-(a.at||0));const days={};
galList.forEach(i=>{const d=new Date(i.at||0),k=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');(days[k]=days[k]||[]).push(i)});
$('#gbody').innerHTML=Object.keys(days).map(k=>`<div class="dh">${k}</div><div class="pg">${days[k].map(i=>cell(i,'viewP')).join('')}</div>`).join('')||'<div class="hint">사진이 없습니다. 오른쪽 위 ＋를 눌러 올리세요.</div>'}
function pickP(id){const g=data.groups.find(x=>x.id===galG);if(!g)return;
if(!selP){selP=id}else if(selP===id){selP=null}
else{const a=g.photos.findIndex(x=>x.id===selP),b=g.photos.findIndex(x=>x.id===id);if(a>=0&&b>=0){const it=g.photos.splice(a,1)[0];g.photos.splice(b,0,it);save()}selP=null}
renderBody()}

/* ===== 올리기 (사진 압축 / 영상 압축) ===== */
async function rs(src,w,q){const b=src instanceof Blob?await createImageBitmap(src,{imageOrientation:'from-image'}):src;
const s=Math.min(1,w/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s|0;c.height=b.height*s|0;
c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
const once=(e,ev)=>new Promise((r,j)=>{e.addEventListener(ev,r,{once:true});e.addEventListener('error',()=>j(new Error('읽기 실패')),{once:true})});
async function vthumb(f){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);await once(v,'loadeddata');
v.currentTime=Math.min(.5,v.duration||0);await once(v,'seeked');return rs(await createImageBitmap(v),400,.7)}
async function packV(f){try{const v=document.createElement('video');v.playsInline=true;v.volume=0;v.src=URL.createObjectURL(f);await once(v,'loadedmetadata');
const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*s&~1;c.height=v.videoHeight*s&~1;
const x=c.getContext('2d'),out=c.captureStream(30);await v.play();(v.captureStream?v.captureStream():new MediaStream()).getAudioTracks().forEach(t=>out.addTrack(t));
const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
const rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:2e6}),ch=[];rec.ondataavailable=e=>ch.push(e.data);
const done=new Promise(r=>rec.onstop=r);rec.start(1000);
(function d(){if(v.ended)return;x.drawImage(v,0,0,c.width,c.height);requestAnimationFrame(d)})();
await once(v,'ended');rec.stop();await done;const o=new Blob(ch,{type:mt.split(';')[0]});return o.size&&o.size<f.size?o:f}catch(e){return f}}
async function one(f,gid){const v=f.type.startsWith('video'),id=uid(),d='g/'+gid+'/';let m,t,lat,lng,ext='jpg',at=f.lastModified;
if(v){m=await packV(f);t=await vthumb(f);ext=m===f?(f.name.split('.').pop()||'mp4'):m.type.includes('mp4')?'mp4':'webm'}
else{const g=await exifr.gps(f).catch(()=>null);if(g){lat=g.latitude;lng=g.longitude}
const e=await exifr.parse(f,['DateTimeOriginal']).catch(()=>null);if(e&&e.DateTimeOriginal)at=+e.DateTimeOriginal;
m=await rs(f,1600,.8);t=await rs(f,400,.7)}
const p=d+id+'.'+ext,tp=d+'t_'+id+'.jpg';
await put(p,m,m.type||'video/mp4');await put(tp,t,'image/jpeg');
return{id,p,t:tp,k:v?'v':'p',lat,lng,at}}
async function upP(fs){const g=data.groups.find(x=>x.id===galG);if(!g)return alert('먼저 왼쪽 아래 ＋ 그룹으로 그룹을 만들어 주세요.');
const st=$('#gst');let n=0;
for(const f of fs){st.textContent='올리는 중 '+(++n)+'/'+fs.length+' (영상은 시간이 걸립니다. 화면을 켜 두세요)';
try{g.photos.push(await one(f,g.id));save()}catch(e){alert(f.name+' 실패: '+e.message)}}
st.textContent='';render()}

/* ===== 뒤로가기 처리 ===== */
const ovs=[];
function openOv(id,onClose){const e=document.getElementById(id);if(e.classList.contains('show'))return;e.classList.add('show');ovs.push({id,onClose});history.pushState({ov:id},'')}
function closeOv(id){const t=ovs[ovs.length-1];if(t&&t.id===id){history.back();return}
const i=ovs.findIndex(o=>o.id===id);if(i>=0){const o=ovs.splice(i,1)[0];document.getElementById(id).classList.remove('show');if(o.onClose)o.onClose()}else document.getElementById(id).classList.remove('show')}
window.addEventListener('popstate',()=>{const t=ovs.pop();if(t){document.getElementById(t.id).classList.remove('show');if(t.onClose)t.onClose()}});

/* ===== 크게 보기 ===== */
function viewP(id){gi=galList;gx=galList.findIndex(x=>x.id===id);openOv('gv',()=>{$('#gm').innerHTML=''});showG()}
function showG(){const it=gi[gx],my=++gTok,box=$('#gm');box.innerHTML='';
if(it.k==='v'){box.innerHTML='<video src="'+F(it.p)+'" controls autoplay playsinline></video>'}
else{const im=document.createElement('img');im.src=F(it.t);box.appendChild(im);const hi=new Image();hi.onload=()=>{if(my===gTok)im.src=F(it.p)};hi.src=F(it.p)}
$('#gc').textContent=(gx+1)+' / '+gi.length;
[1,-1,2].forEach(d=>{const n=gi[(gx+d+gi.length)%gi.length];if(n&&n.k!=='v'){new Image().src=F(n.p)}})}
const mvG=d=>{gx=(gx+d+gi.length)%gi.length;showG()};
function closeG(){closeOv('gv')}
async function delG(){if(!confirm('이 사진을 삭제할까요?'))return;const it=gi[gx],g=data.groups.find(x=>x.id===galG);
await del([it.p,it.t]);g.photos=g.photos.filter(x=>x.id!==it.id);save();closeG();render()}
$('#gm').addEventListener('touchstart',e=>sx0=e.touches[0].clientX);
$('#gm').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx0;if(Math.abs(d)>50)mvG(d<0?1:-1)});

/* ===== 지도 + GPX ===== */
const pts=t=>[...new DOMParser().parseFromString(t,'text/xml').querySelectorAll('trkpt')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]);
const km=a=>a.reduce((s,p,i)=>{if(!i)return 0;const q=a[i-1],r=Math.PI/180,x=Math.sin((p[0]-q[0])*r/2)**2+Math.cos(q[0]*r)*Math.cos(p[0]*r)*Math.sin((p[1]-q[1])*r/2)**2;return s+12742*Math.asin(Math.sqrt(x))},0);
function openMap(){openOv('mapv');
if(!map){map=L.map('map').setView([36.64,127.49],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map)}
setTimeout(()=>map.invalidateSize(),80);mk.forEach(m=>m.remove());mk=[];
data.groups.flatMap(g=>g.photos||[]).filter(i=>i.lat!=null).forEach(i=>mk.push(L.marker([i.lat,i.lng]).addTo(map).bindPopup('<img src="'+F(i.t)+'" width="120">')));
if(mk.length)map.fitBounds(L.featureGroup(mk).getBounds().pad(.2));loadTrk()}
function loadTrk(){$('#trk').innerHTML=(data.tracks||[]).map(x=>`<div class="card"><span>${esc(x.name)}<br><small>${x.km.toFixed(1)}km</small></span><span class="row"><button onclick="showTrk('${x.id}')">보기</button><button onclick="dlTrk('${x.id}')">받기</button><button class="red" onclick="delTrk('${x.id}')">삭제</button></span></div>`).join('')}
async function addGpx(f){if(!f)return;const a=pts(await f.text());if(!a.length)return alert('경로 점을 찾지 못했습니다.');
const id=uid(),p='gpx/'+id+'.gpx';await put(p,f,'application/gpx+xml');
(data.tracks=data.tracks||[]).unshift({id,name:f.name.replace(/\.gpx$/i,''),path:p,km:km(a)});save();loadTrk()}
async function showTrk(id){const x=data.tracks.find(t=>t.id===id);if(!x)return;const a=pts(await(await fetch(F(x.path))).text());
pl.forEach(l=>l.remove());pl=[L.polyline(a,{color:'#007aff',weight:4}).addTo(map)];map.fitBounds(pl[0].getBounds())}
function dlTrk(id){const x=data.tracks.find(t=>t.id===id);if(x)location.href=F(x.path)+'&dl='+encodeURIComponent(x.name+'.gpx')}
async function delTrk(id){const x=data.tracks.find(t=>t.id===id);if(!x||!confirm('경로를 삭제할까요?'))return;
await del([x.path]);data.tracks=data.tracks.filter(t=>t.id!==id);save();loadTrk()}

/* ===== 걸음 수 ===== */
function openSteps(){openOv('stv');$('#sd').value=new Date().toISOString().slice(0,10);loadSteps()}
function saveStep(){const n=+$('#sn').value;if(!$('#sd').value||isNaN(n))return;(data.steps=data.steps||{})[$('#sd').value]=n;save();$('#sn').value='';loadSteps()}
function loadSteps(){const e=Object.entries(data.steps||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14),mx=Math.max(1,...e.map(x=>x[1]));
$('#sl').innerHTML=e.map(([d,n])=>`<div style="margin:8px 0"><small>${d} · ${n.toLocaleString()}걸음</small><div style="height:14px;border-radius:4px;background:var(--pri);width:${n/mx*100}%"></div></div>`).join('')||'<small>기록이 없습니다.</small>'}

init();
</script>
</body>
</html>
